<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StackPicker</title>
  <!-- The real popup stylesheet, so the screenshot can never drift from the product. -->
  <link rel="stylesheet" href="../src/popup/style.css" />
  <style>body { max-height: none; overflow: hidden; }</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="../public/icon128.png" class="mark" alt="" />
      <span class="title">StackPicker</span>
      <span class="count">10</span>
    </div>
    <span class="hostname">example.com</span>
  </header>
  <main>
    <section>
      <h2>JS Framework</h2>
      <ul>
        <li style="--tech:#0070F3"><span class="dot"></span><span class="name">Next.js</span></li>
        <li style="--tech:#61DAFB"><span class="dot"></span><span class="name">React</span></li>
      </ul>
    </section>
    <section>
      <h2>UI / CSS</h2>
      <ul>
        <li style="--tech:#38BDF8"><span class="dot"></span><span class="name">Tailwind CSS</span></li>
        <li style="--tech:#161618"><span class="dot"></span><span class="name">Radix UI</span></li>
      </ul>
    </section>
    <section>
      <h2>Hosting</h2>
      <ul>
        <li style="--tech:#5E5E5E"><span class="dot"></span><span class="name">Vercel</span></li>
      </ul>
    </section>
    <section>
      <h2>CDN</h2>
      <ul>
        <li style="--tech:#F48120"><span class="dot"></span><span class="name">Cloudflare</span></li>
      </ul>
    </section>
    <section>
      <h2>Analytics</h2>
      <ul>
        <li style="--tech:#E37400"><span class="dot"></span><span class="name">Google Analytics</span></li>
        <li style="--tech:#5E5E5E"><span class="dot"></span><span class="name">Vercel Analytics</span></li>
      </ul>
    </section>
    <section>
      <h2>Build Tool</h2>
      <ul>
        <li style="--tech:#8DD6F9"><span class="dot"></span><span class="name">webpack</span></li>
      </ul>
    </section>
    <section>
      <h2>Dev Tools</h2>
      <ul>
        <li style="--tech:#8B6FC0"><span class="dot"></span><span class="name">Sentry</span></li>
      </ul>
    </section>
  </main>
</body>
</html>
